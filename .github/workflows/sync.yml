name: Scheduled Sync

# Keeps the deployed backend's data fresh from OUTSIDE the app, so it works even
# on a free-tier host that sleeps (the internal node-cron stops while asleep).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   API_BASE_URL  e.g. https://extratime-api.onrender.com   (no trailing slash)
#   SYNC_SECRET   the same value as the backend's SYNC_SECRET
#
# WHAT each tick does is NOT defined here — it lives in
# backend/src/features/football/sync/ticks.ts, which the internal cron calls too.
# This file only decides WHEN. Defining the work in both places is how the two
# triggers drift apart and one ends up calling something expensive or something
# that no longer exists.
#
# Each tick adapts to the live API-Football plan on its own (a daily /status probe
# records what it allows), so nothing here needs changing when the subscription
# lapses or comes back:
#
#   PAID (Pro, 7500/day)     ~250 requests/day
#   FREE (100/day)           ~25 requests/day — tables and leaderboards are then
#                            computed from stored results, since that plan refuses
#                            league+season filters for the current season.
#
# The backend enforces the daily ceiling itself, so an accidental extra trigger
# costs a skipped job rather than a suspended account.

on:
  schedule:
    - cron: '*/10 10-23 * * *' # settle + keep the host awake — costs no API requests
    - cron: '3 11-23 * * *' # scores, tables, backlog, goalscorers
    - cron: '0 4 * * *' # schedule sweep, leaderboards, squads, plan probe
  workflow_dispatch: {}

concurrency:
  group: extratime-sync
  cancel-in-progress: false

jobs:
  settle:
    name: Settle + keep-alive
    if: github.event.schedule == '*/10 10-23 * * *'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -m 90 "${{ secrets.API_BASE_URL }}/health" || true
          curl -fsS -m 90 -X POST "${{ secrets.API_BASE_URL }}/api/v1/admin/sync/settle" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}" || true

  hourly:
    name: Scores + details
    if: github.event.schedule == '3 11-23 * * *'
    runs-on: ubuntu-latest
    steps:
      - run: |
          for tick in hourly backlog detail; do
            curl -fsS -m 300 -X POST "${{ secrets.API_BASE_URL }}/api/v1/admin/sync/tick/$tick" \
              -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}" || true
          done

  daily:
    name: Daily data
    if: github.event.schedule == '0 4 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -m 120 -X POST "${{ secrets.API_BASE_URL }}/api/v1/admin/sync/plan" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}" || true
          for tick in schedule daily-lists; do
            curl -fsS -m 600 -X POST "${{ secrets.API_BASE_URL }}/api/v1/admin/sync/tick/$tick" \
              -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}" || true
          done
